name: Monitor de vuelos

on:
  schedule:
    - cron: "7 */3 * * *"   # cada 3 horas (UTC), incluida la madrugada
  workflow_dispatch:        # permite correrlo a mano desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/New_York
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      REPORTE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Consultar precios
        run: python vuelos.py run 2>&1 | grep -v "h2 connection"
      - name: Guardar historial en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios.db
          git commit -m "Precios $(date '+%Y-%m-%d %H:%M')" || echo "Sin cambios"
          git pull --rebase && git push
      - name: Preparar página
        run: mkdir -p _site && cp reporte.html _site/index.html && cp icon.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
